# Install and run mpxa. Tests for both C++ and the Python wrappers are run.
#
# This is mpxa's own everyday CI: it always tests against porepy's current
# default branch (via a plain `git clone`, no pinned ref) and runs on mpxa's
# own pushes/PRs/nightly schedule. It is intentionally unrelated to the
# porepy-triggered dispatch mechanism in porepy-integration-test.yml (which
# tests a *specific* porepy PR/SHA and is only ever started by porepy, via
# workflow_dispatch) -- the two workflows share no state.
#
# The one addition on top of the pre-existing CI is the last step: on a
# failed nightly (`schedule`) run, write the porepy commit that was tested to
# the job summary, so a nightly failure can be traced to a porepy commit.
# It deliberately does not comment on any porepy PR: porepy changes are
# already reported on the responsible PR by porepy-integration-test.yml,
# right when they are opened or merged. A nightly failure is more likely
# caused by a change in mpxa itself or in its dependencies, and blaming
# whichever porepy PR happens to be at the tip of develop would be wrong.
name: MPXA_CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Do a nightly run of the tests
    - cron: '0 1 * * *'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The Python version is bound by the versions supported by PorePy.
          python-version: '3.14'

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              cmake \
              libgtest-dev \
              libeigen3-dev \
              python3-pybind11 \
              pybind11-dev \
              libglu1-mesa \
              libgeos-dev \
              libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[testing]

      - name: Clone and Install PorePy
        run: |
          git clone https://github.com/pmgbergen/porepy.git /tmp/porepy
          pip install /tmp/porepy

      # This repo's CI always clones porepy's current default branch (no
      # pinned ref), so the exact commit tested is only known after cloning.
      # Recorded now (as a step `output`, readable later in this same job as
      # `steps.porepy-sha.outputs.sha`) so the nightly failure step below can
      # report it.
      - name: Capture tested porepy SHA
        id: porepy-sha
        run: echo "sha=$(git -C /tmp/porepy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and run C++ tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Python tests
        run: |
          pytest tests/python

      - name: Log tested porepy commit if nightly run failed
        if: failure() && github.event_name == 'schedule'
        env:
          POREPY_SHA: ${{ steps.porepy-sha.outputs.sha }}
        run: |
          echo "### mpxa nightly test failed" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$POREPY_SHA" ]; then
            echo "Tested against porepy \`$POREPY_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Failed before porepy was cloned; see the step logs." >> "$GITHUB_STEP_SUMMARY"
          fi