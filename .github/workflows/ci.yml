# Install and run mpxa. Tests for both C++ and the Python wrappers are run.
#
# Tests against PorePy's current develop. On a failed nightly run, the tested
# PorePy commit is written to the job summary. Testing of specific PorePy
# commits is done in porepy-integration-test.yml.
name: MPXA_CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Do a nightly run of the tests
    - cron: '0 1 * * *'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The Python version is bound by the versions supported by PorePy.
          python-version: '3.14'

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              cmake \
              libgtest-dev \
              libeigen3-dev \
              python3-pybind11 \
              pybind11-dev \
              libglu1-mesa \
              libgeos-dev \
              libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[testing]

      - name: Clone and Install PorePy
        run: |
          git clone https://github.com/pmgbergen/porepy.git /tmp/porepy
          pip install /tmp/porepy

      # Reported by the nightly failure step below.
      - name: Capture tested porepy SHA
        id: porepy-sha
        run: echo "sha=$(git -C /tmp/porepy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and run C++ tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Python tests
        run: |
          pytest tests/python

      - name: Log tested porepy commit if nightly run failed
        if: failure() && github.event_name == 'schedule'
        env:
          POREPY_SHA: ${{ steps.porepy-sha.outputs.sha }}
        run: |
          echo "### mpxa nightly test failed" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$POREPY_SHA" ]; then
            echo "Tested against porepy \`$POREPY_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Failed before porepy was cloned; see the step logs." >> "$GITHUB_STEP_SUMMARY"
          fi