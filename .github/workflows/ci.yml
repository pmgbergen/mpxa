# Install and run mpxa. Tests for both C++ and the Python wrappers are run.
#
# This is mpxa's own everyday CI: it always tests against porepy's current
# default branch (via a plain `git clone`, no pinned ref) and runs on mpxa's
# own pushes/PRs/nightly schedule. It is intentionally unrelated to the
# porepy-triggered dispatch mechanism in porepy-integration-test.yml (which
# tests a *specific* porepy PR/SHA and is only ever started by porepy, via
# workflow_dispatch) -- the two workflows share no state.
#
# The one piece of cross-repo behavior that *does* live here (added on top of
# the pre-existing CI) is the last step: on a nightly (`schedule`) run only,
# if the porepy build fails, resolve which porepy PR most recently merged the
# tested SHA and post a comment there, so a porepy-side regression that only
# shows up nightly doesn't go unnoticed for days. See
# `.claude/downstream_testing.md` in the porepy repo for why this exists
# (Phase 1 of that design) and how it relates to porepy-integration-test.yml
# (Phase 2/3, same repo, same comment-upsert pattern, but triggered
# immediately from porepy instead of waiting for the nightly cron).
#
# Debugging the nightly comment-back step specifically:
#   - It only ever runs `if: failure() && github.event_name == 'schedule'` --
#     an ordinary PR/push CI failure on mpxa never triggers a comment
#     anywhere. To see it exercised, either wait for a nightly failure or
#     temporarily change the `if:` while testing on a fork.
#   - `POREPY_SHA` comes from the "Capture tested porepy SHA" step just
#     above the test steps -- if that step didn't run (e.g. the workflow
#     failed even earlier, during dependency install), this step has no SHA
#     to look up and the PR-resolution API call will fail; check the run log
#     for that step's output first.
#   - The PR lookup (`commits/<sha>/pulls`) and the comment upsert
#     (find-by-marker, then PATCH-or-POST) follow the same logic as
#     porepy-integration-test.yml's failure step in this repo -- see that
#     file's header comment for the mechanics (marker comments, PRs-as-issues
#     in the GitHub API, etc.) if something here is unclear.
name: MPXA_CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Do a nightly run of the tests
    - cron: '0 1 * * *'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The Python version is bound by the versions supported by PorePy.
          python-version: '3.14'

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              cmake \
              libgtest-dev \
              libeigen3-dev \
              python3-pybind11 \
              pybind11-dev \
              libglu1-mesa \
              libgeos-dev \
              libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[testing]

      - name: Clone and Install PorePy
        run: |
          git clone https://github.com/pmgbergen/porepy.git /tmp/porepy
          pip install /tmp/porepy

      # This repo's CI always clones porepy's current default branch (no
      # pinned ref), so the exact commit tested is only known after cloning.
      # Recorded now (as a step `output`, readable later in this same job as
      # `steps.porepy-sha.outputs.sha`) so the failure-comment step below can
      # report/resolve it, without needing to re-derive it from a stale
      # checkout after the test steps have run.
      - name: Capture tested porepy SHA
        id: porepy-sha
        run: echo "sha=$(git -C /tmp/porepy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and run C++ tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Python tests
        run: |
          pytest tests/python

      - name: Comment on originating porepy PR if nightly run failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
          POREPY_SHA: ${{ steps.porepy-sha.outputs.sha }}
        run: |
          PR_NUMBER=$(gh api "repos/pmgbergen/porepy/commits/$POREPY_SHA/pulls" --jq '.[0].number // empty')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ -z "$PR_NUMBER" ]; then
            echo "### mpxa nightly test failed" >> "$GITHUB_STEP_SUMMARY"
            echo "No originating porepy PR was found for \`$POREPY_SHA\`; nowhere to comment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          MARKER="<!-- downstream-ci-comment: mpxa -->"
          BODY="$MARKER
          ### ❌ mpxa nightly integration test failed

          The nightly build against porepy \`$POREPY_SHA\` failed in [mpxa]($RUN_URL).

          [View run]($RUN_URL)"

          EXISTING=$(gh api "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/pmgbergen/porepy/issues/comments/$EXISTING" -f body="$BODY"
          else
            gh api --method POST "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi