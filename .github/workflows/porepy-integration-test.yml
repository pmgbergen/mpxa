# Runs mpxa's test suite against a specific porepy ref/SHA, dispatched by
# porepy's trigger-downstream-tests.yml (post-merge) or, in a later phase,
# by a porepy pull request. This is separate from ci.yml so mpxa's own
# PR/push/nightly CI (which always tests against porepy's current default
# branch) is untouched.
#
# On failure, if a porepy PR number was supplied, upserts a marked comment on
# that PR; otherwise the failure is only visible in this run's job summary.
name: PorePy integration test

on:
  workflow_dispatch:
    inputs:
      porepy_ref:
        description: 'porepy branch to check out if porepy_sha is not set'
        required: true
        default: 'develop'
      porepy_sha:
        description: 'porepy commit SHA to check out (takes precedence over porepy_ref)'
        required: false
        default: ''
      porepy_pr_number:
        description: 'porepy PR number to comment on if the run fails (empty = no comment)'
        required: false
        default: ''
      trigger_event:
        description: 'What triggered this dispatch (push, pull_request, ...)'
        required: false
        default: 'push'

concurrency:
  group: downstream-dispatch-${{ inputs.porepy_pr_number || inputs.porepy_sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test against porepy ${{ inputs.porepy_sha || inputs.porepy_ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              cmake \
              libgtest-dev \
              libeigen3-dev \
              python3-pybind11 \
              pybind11-dev \
              libglu1-mesa \
              libgeos-dev \
              libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[testing]

      - name: Clone and install PorePy at requested ref
        run: |
          CHECKOUT_REF="${{ inputs.porepy_sha != '' && inputs.porepy_sha || inputs.porepy_ref }}"
          git clone https://github.com/pmgbergen/porepy.git /tmp/porepy
          git -C /tmp/porepy checkout "$CHECKOUT_REF"
          pip install /tmp/porepy

      - name: Build and run C++ tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Python tests
        run: |
          pytest tests/python

      - name: Comment on porepy PR if failed
        if: failure() && inputs.porepy_pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
        run: |
          MARKER="<!-- downstream-ci-comment: mpxa -->"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="$MARKER
          ### ❌ mpxa integration test failed

          Testing against porepy \`${{ inputs.porepy_sha || inputs.porepy_ref }}\` (triggered by \`${{ inputs.trigger_event }}\`) failed in [mpxa]($RUN_URL).

          [View run]($RUN_URL)"

          EXISTING=$(gh api "repos/pmgbergen/porepy/issues/${{ inputs.porepy_pr_number }}/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/pmgbergen/porepy/issues/comments/$EXISTING" -f body="$BODY"
          else
            gh api --method POST "repos/pmgbergen/porepy/issues/${{ inputs.porepy_pr_number }}/comments" -f body="$BODY"
          fi

      - name: Log failure to job summary if no PR to comment on
        if: failure() && inputs.porepy_pr_number == ''
        run: |
          echo "### mpxa integration test failed" >> "$GITHUB_STEP_SUMMARY"
          echo "No originating porepy PR was resolved for \`${{ inputs.porepy_sha || inputs.porepy_ref }}\`; nowhere to comment." >> "$GITHUB_STEP_SUMMARY"
