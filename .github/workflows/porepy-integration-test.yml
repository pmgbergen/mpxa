# Runs mpxa's test suite against a specific porepy ref/SHA. This workflow is
# never triggered by anything happening in mpxa itself -- it only has a
# `workflow_dispatch` trigger, meaning it starts only when something calls
# the GitHub API to run it. That caller is porepy's
# `.github/workflows/trigger-downstream-tests.yml`, on a push to porepy's
# `develop` branch or on a porepy pull request; see that file's header
# comment (in the porepy repo) for the full cross-repo picture and for
# `.claude/downstream_testing.md`, the design doc this whole setup follows.
# This file is separate from ci.yml so mpxa's own PR/push/nightly CI (which
# always tests against porepy's current default branch, unrelated to this
# dispatch mechanism) is untouched.
#
# On failure, if a porepy PR number was supplied, upserts (edits-or-creates)
# a marked comment on that PR; otherwise the failure is only visible in this
# run's job summary. On success, an existing marked comment is edited to say
# the tests now pass, but no new comment is created -- a PR that never broke
# mpxa gets no comment at all.
#
# --- How this fits together (read this if you only know GitHub Actions
#     superficially) ---
#
#   1. `on: workflow_dispatch: inputs:` declares this workflow's parameters.
#      Think of them like a function signature: whoever calls
#      `gh workflow run porepy-integration-test.yml -f porepy_ref=... -f ...`
#      (or uses "Run workflow" in the GitHub UI) must supply values matching
#      these names. Inside the workflow they're read as `inputs.<name>`.
#      Docs: https://docs.github.com/en/actions/using-workflows/manually-running-a-workflow
#      and https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onworkflow_dispatchinputs
#   2. The `build-and-test` job installs mpxa's own dependencies, then
#      installs porepy from the requested `porepy_sha` (if set) or
#      `porepy_ref`, then runs mpxa's C++ and Python test suites -- this
#      part is otherwise identical to ci.yml's own steps.
#   3. If a PR number was given, the "Update comment on porepy PR" step runs
#      on both success and failure (not on cancellation) and reports the
#      outcome there. If no PR number was given and a step failed, the
#      failure is written to this run's job summary instead.
#
# Debugging / extending:
#   - To manually re-run this exact workflow without needing a real porepy
#     push/PR: GitHub Actions tab -> this workflow -> "Run workflow", and
#     fill in the inputs by hand (e.g. porepy_ref=develop, leave the rest
#     blank to test the "no PR to comment on" path).
#   - If the run never even starts: check porepy's
#     trigger-downstream-tests.yml run log for the `gh workflow run` call
#     that should have triggered it -- a failure there (bad PAT scope, wrong
#     ref/workflow_file in porepy's downstream-repos.json) means this
#     workflow is never invoked at all, and nothing will appear here.
#   - If the run happens but no comment appears on the porepy PR: check this
#     run's own log for the "Update comment on porepy PR" step. Common
#     causes: `porepy_pr_number` was empty (see the job summary instead),
#     or `DOWNSTREAM_DISPATCH_PAT` lacks "Pull requests: Read and write" on
#     porepy.
#   - The upsert logic below treats the porepy PR as a GitHub "issue" (GitHub
#     PRs are issues under the hood, sharing the issues/comments API) and
#     finds any previous comment by its hidden `MARKER` HTML comment, editing
#     it in place instead of posting a new one on every failed re-run. If you
#     need to see the raw comment IDs, `gh api repos/pmgbergen/porepy/issues/<PR>/comments`
#     lists them.
name: PorePy integration test

on:
  workflow_dispatch:
    inputs:
      porepy_ref:
        description: 'porepy branch to check out if porepy_sha is not set'
        required: true
        default: 'develop'
      porepy_sha:
        description: 'porepy commit SHA to check out (takes precedence over porepy_ref)'
        required: false
        default: ''
      porepy_pr_number:
        description: 'porepy PR number to comment on if the run fails (empty = no comment)'
        required: false
        default: ''
      trigger_event:
        description: 'What triggered this dispatch (push, pull_request, ...)'
        required: false
        default: 'push'

# Concurrency groups are scoped to this repo, so this is independent of the
# group used in porepy's trigger-downstream-tests.yml. Keying by the tested
# SHA means a re-dispatch of the same porepy commit cancels the older run,
# while runs for different commits (e.g. a PR's last pre-merge run and the
# post-merge run for its merge commit) never cancel each other.
concurrency:
  group: downstream-dispatch-${{ inputs.porepy_sha || inputs.porepy_ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test against porepy ${{ inputs.porepy_sha || inputs.porepy_ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              cmake \
              libgtest-dev \
              libeigen3-dev \
              python3-pybind11 \
              pybind11-dev \
              libglu1-mesa \
              libgeos-dev \
              libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[testing]

      - name: Clone and install PorePy at requested ref
        run: |
          # porepy_sha wins when set (it's the immutable, exact commit under
          # test); porepy_ref is the fallback for a manual/dev run where only
          # a branch name was given.
          CHECKOUT_REF="${{ inputs.porepy_sha != '' && inputs.porepy_sha || inputs.porepy_ref }}"
          git clone https://github.com/pmgbergen/porepy.git /tmp/porepy
          git -C /tmp/porepy checkout "$CHECKOUT_REF"
          pip install /tmp/porepy

      - name: Build and run C++ tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Python tests
        run: |
          pytest tests/python

      # Runs on success and failure, but not on cancellation (a superseded run
      # has nothing to report). `job.status` is the outcome of the steps so
      # far. On failure, create or edit the marked comment; on success, only
      # edit an existing one, so the PR stops showing a stale failure.
      - name: Update comment on porepy PR
        if: (success() || failure()) && inputs.porepy_pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ inputs.porepy_pr_number }}
          TESTED_REF: ${{ inputs.porepy_sha || inputs.porepy_ref }}
          TRIGGER_EVENT: ${{ inputs.trigger_event }}
        run: |
          MARKER="<!-- downstream-ci-comment: mpxa -->"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$JOB_STATUS" = "success" ]; then
            HEADLINE="### ✅ mpxa integration test passed"
            RESULT="passed"
          else
            HEADLINE="### ❌ mpxa integration test failed"
            RESULT="failed"
          fi
          BODY="$MARKER
          $HEADLINE

          Testing against porepy \`$TESTED_REF\` (triggered by \`$TRIGGER_EVENT\`) $RESULT in [mpxa]($RUN_URL).

          [View run]($RUN_URL)"

          EXISTING=$(gh api --paginate "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/pmgbergen/porepy/issues/comments/$EXISTING" -f body="$BODY"
          elif [ "$JOB_STATUS" != "success" ]; then
            gh api --method POST "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" -f body="$BODY"
          else
            echo "Passed, and no earlier comment on porepy PR #$PR_NUMBER; nothing to update."
          fi

      - name: Log failure to job summary if no PR to comment on
        if: failure() && inputs.porepy_pr_number == ''
        run: |
          echo "### mpxa integration test failed" >> "$GITHUB_STEP_SUMMARY"
          echo "No originating porepy PR was resolved for \`${{ inputs.porepy_sha || inputs.porepy_ref }}\`; nowhere to comment." >> "$GITHUB_STEP_SUMMARY"
