# Run mpxa's tests against a given PorePy commit, and report the result on the
# PorePy PR that the commit belongs to.
#
# Triggered only by workflow_dispatch, from PorePy's
# .github/workflows/trigger-downstream-tests.yml on PRs into, and pushes to,
# PorePy's develop. The inputs below are the interface to that workflow. ci.yml
# is mpxa's own CI and is unaffected.
#
# If porepy_pr_number is set, a failure creates or updates a comment on that
# PR, found by a hidden marker. A pass only updates an existing comment, so PRs
# that never broke mpxa get no comment. Without a PR number, failures are
# written to the job summary.
#
# Debugging: run manually via "Run workflow" in the Actions tab. If no run
# appears, check the dispatching run in PorePy. If no comment appears, check
# that DOWNSTREAM_DISPATCH_PAT has write access to PorePy's pull requests.
# Docs: https://docs.github.com/en/actions/using-workflows/manually-running-a-workflow
name: PorePy integration test

on:
  workflow_dispatch:
    inputs:
      porepy_ref:
        description: 'porepy branch to check out if porepy_sha is not set'
        required: true
        default: 'develop'
      porepy_sha:
        description: 'porepy commit SHA to check out (takes precedence over porepy_ref)'
        required: false
        default: ''
      porepy_pr_number:
        description: 'porepy PR number to comment on if the run fails (empty = no comment)'
        required: false
        default: ''
      trigger_event:
        description: 'What triggered this dispatch (push, pull_request, ...)'
        required: false
        default: 'push'

# A re-dispatch of the same PorePy commit cancels the older run.
concurrency:
  group: downstream-dispatch-${{ inputs.porepy_sha || inputs.porepy_ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test against porepy ${{ inputs.porepy_sha || inputs.porepy_ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Cloned before Python is set up, since the Python version is read from it.
      - name: Clone PorePy at requested ref
        run: |
          # porepy_sha takes precedence; porepy_ref is for manual runs.
          CHECKOUT_REF="${{ inputs.porepy_sha != '' && inputs.porepy_sha || inputs.porepy_ref }}"
          git clone https://github.com/pmgbergen/porepy.git /tmp/porepy
          git -C /tmp/porepy checkout "$CHECKOUT_REF"

      # Use the latest Python version PorePy tests on: the last entry of the
      # version matrix in PorePy's run-pytest.yml (yq is preinstalled on GitHub's
      # Ubuntu runners). Fails loudly if that file changes shape.
      - name: Determine latest Python version supported by PorePy
        id: python-version
        run: |
          VERSION=$(yq '.jobs.*.strategy.matrix.python-version[-1]' \
            /tmp/porepy/.github/workflows/run-pytest.yml)
          if ! [[ "$VERSION" =~ ^3\.[0-9]+$ ]]; then
            echo "::error::Could not read Python version from PorePy's run-pytest.yml (got '$VERSION')."
            exit 1
          fi
          echo "Using Python $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ steps.python-version.outputs.version }}

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              cmake \
              libgtest-dev \
              libeigen3-dev \
              python3-pybind11 \
              pybind11-dev \
              libglu1-mesa \
              libgeos-dev \
              libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[testing]

      - name: Install PorePy
        run: |
          pip install /tmp/porepy

      - name: Build and run C++ tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run Python tests
        run: |
          pytest tests/python

      # Not run on cancellation. On failure, create or edit the marked
      # comment; on success, only edit an existing one.
      - name: Update comment on porepy PR
        if: (success() || failure()) && inputs.porepy_pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_PAT }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ inputs.porepy_pr_number }}
          TESTED_REF: ${{ inputs.porepy_sha || inputs.porepy_ref }}
          TRIGGER_EVENT: ${{ inputs.trigger_event }}
        run: |
          MARKER="<!-- downstream-ci-comment: mpxa -->"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$JOB_STATUS" = "success" ]; then
            HEADLINE="### ✅ mpxa integration test passed"
            RESULT="passed"
          else
            HEADLINE="### ❌ mpxa integration test failed"
            RESULT="failed"
          fi
          BODY="$MARKER
          $HEADLINE

          Testing against porepy \`$TESTED_REF\` (triggered by \`$TRIGGER_EVENT\`) $RESULT in [mpxa]($RUN_URL).

          [View run]($RUN_URL)"

          EXISTING=$(gh api --paginate "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh api --method PATCH "repos/pmgbergen/porepy/issues/comments/$EXISTING" -f body="$BODY"
          elif [ "$JOB_STATUS" != "success" ]; then
            gh api --method POST "repos/pmgbergen/porepy/issues/$PR_NUMBER/comments" -f body="$BODY"
          else
            echo "Passed, and no earlier comment on porepy PR #$PR_NUMBER; nothing to update."
          fi

      - name: Log failure to job summary if no PR to comment on
        if: failure() && inputs.porepy_pr_number == ''
        run: |
          echo "### mpxa integration test failed" >> "$GITHUB_STEP_SUMMARY"
          echo "No originating porepy PR was resolved for \`${{ inputs.porepy_sha || inputs.porepy_ref }}\`; nowhere to comment." >> "$GITHUB_STEP_SUMMARY"
